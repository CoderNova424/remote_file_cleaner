name: Build macOS App Bundle

on: [push, workflow_dispatch]

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install PyInstaller and dependencies
        run: |
          pip install --upgrade pip
          pip install pyinstaller pillow send2trash
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Build Mac Bundle
        run: |
          pyinstaller --windowed --noconsole --name="RemoteFileCleaner" --target-arch universal2 Remote_File_Cleaner.py

      - name: Zip the App Bundle
        run: |
          cd dist
          zip -r ../RemoteFileCleaner_Mac.zip RemoteFileCleaner.app

      - name: Upload Finished App to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: macos-application
          path: RemoteFileCleaner_Mac.zip
